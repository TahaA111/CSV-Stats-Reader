<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Signup</title>
</head>
<body class="login-page">

    <div class = "authLayout">
    <section class="brandPanel">
  <p class="brandName">Peak</p>
  <h2 class="brandPitch">Don't wonder. Just track.</h2>
  <ul class="brandPoints">
    <li>Track your kWh usage and estimated cost</li>
    <li>Save every upload privately to your account</li>
    <li>Download a PDF summary in one click</li>
  </ul>
</section>

    <div id="signupForm">
    <h1>Sign Up</h1>
    <p class="signupSubtitle">Track and understand your energy usage.</p>
    <input type="text" id="signupUsername" placeholder="Username" required>
    <input type="email" id="signupEmail" placeholder="Email" required>
    <input type="password" id="signupPassword" placeholder="Password" required>
    <p class="formError" id="signupError"></p>
    <button id="signupButton">Sign Up</button>
    <p class="authSwitch">Already have an account? <a href="login.html">Log in</a></p>
  </div>

  <script>
   const API_URL = 'http://127.0.0.1:3000';

    document.getElementById("signupButton").addEventListener("click", function() {

        document.getElementById("signupError").textContent = "";

        let username = document.getElementById("signupUsername").value;
        let email = document.getElementById("signupEmail").value;
        let password = document.getElementById("signupPassword").value;

        fetch(`${API_URL}/auth/signup`,{
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username,email,password})

        })
        .then(function(res){
            return res.json().then(function(data){
                if(res.ok){
                    window.location.href = 'login.html'
                } else{
                    document.getElementById("signupError").textContent = data.error || 'Signup failed';
                }
            })
        })
    });








  </script>

</body>
</html>
