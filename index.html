<!DOCTYPE html>
<html>
<head>
  <title>CSV Stats Reader</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="chart.umd.min.js"></script>
  <script src="jspdf.umd.min.js"></script>
</head>
<body>

<header class = "topBar">
<h1>CSV Stats Reader</h1>
<button id ="logoutButton">Log Out</button>
</header>
<p class="uploadHint">
Upload a CSV file with <code>date</code> and <code>kwh</code> columns. <br>
<a href="sample_usage.csv" download>Download a sample CSV</a>
</p>

  <input type="file" id="fileinput">

  <div id="results">
    <p id="totalDisplay"></p>
    <p id="averageDisplay"></p>
    <p id="minDisplay"></p>
    <p id="maxDisplay"></p>
    <p id="costDisplay"></p>
  </div>

  <canvas id="usageChart"></canvas>

  <button id="savePdfButton" style="display: none;">Save Summary as PDF</button>
  

  <script>
    const API_URL = 'http://127.0.0.1:3000';

    document.getElementById("logoutButton").addEventListener("click", function(){
      fetch(`${API_URL}/auth/logout`, {
        method: 'POST',
        credentials: 'include'
      }).then(function(res){
        if (res.ok){
          window.location.href = "login.html";
        } else {
          alert("LOGOUT FAILED");
        }
      });
      });

    fetch(`${API_URL}/auth/me`, {
      method: 'GET',
      credentials: 'include'
    })
    .then(function(res){ return res.json(); })
    .then(function(data){
      if (data.user === null){
        window.location.href = "login.html";
      }
    });
    



    let kwhValues = [];
    let dateLabels = [];
    let readingsBatch = [];
    let total = 0;
    let count = 0;
    let min = Infinity;
    let max = -Infinity;
    let minDate = "";
    let maxDate = "";
    let average;
    let myChart;
    let cost;

    document.getElementById("fileinput").addEventListener("change", function(event){

      let reader = new FileReader();

      reader.onload = function(){

        kwhValues = [];
        dateLabels = [];
        readingsBatch = [];
        let lines = reader.result.split("\n");
        let header = lines[0].split(",").map(function(item){ return item.trim().toLowerCase(); });
        total = 0;
        count = 0;
        min = Infinity;
        max = -Infinity;
        minDate = "";
        maxDate = "";
        cost = undefined;


        /*
        AVERAGE DEBUGGING SESSION:
        console.log('Header found:', header);
        console.log('header[1] char codes:', header[1].split('').map(function(c) { return c.charCodeAt(0); }));
        console.log('header[0] check:', header[0] == "date");
        console.log('header[1] check:', header[1] == "kwh");
        console.log('Comparison result:', header[0] == "date" && header[1] == "kwh");
        console.log('header[0] length:', header[0].length, JSON.stringify(header[0]));
        console.log('header[1] length:', header[1].length, JSON.stringify(header[1])); */

        
        if(header[0] == "date" && header[1] == "kwh"){}
        else{
          alert("ERROR file format not supported")
          return;

        }
        

        for (let i = 1; i < lines.length; i++){

          if (lines[i].trim() === "") { continue; }

          let parts = lines[i].split(",").map(function(item){ return item.trim();});
          let kwh = Number(parts[1]);
          if(isNaN(kwh)){
            alert("ERROR file uploaded has unsupported data")
            return;
          }

          total += kwh;
          kwhValues.push(kwh);
          dateLabels.push(parts[0]);
          readingsBatch.push({date:parts[0], kwh:kwh});
          count++;

          if (kwh < min){
            min = kwh;
            minDate = parts[0];
          }
          if (kwh > max){
            max = kwh;
            maxDate = parts[0];
          }
        }

        fetch(`${API_URL}/readings`,{
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            credentials: 'include',
            body: JSON.stringify(readingsBatch)
          });
        
        if (myChart){
          myChart.destroy();
        }

        myChart = new Chart(document.getElementById("usageChart"), {
          type: 'line',
          data: {
            labels: dateLabels,
            datasets: [{
              label: 'kwh Usage',
              data: kwhValues,
              borderColor: '#D9A21B',
              backgroundColor: 'rgba(217, 162, 27, 0.15)',
              
            }]
          }, 
          options: {
            color: '#F1EFEA',
            scales : {
              x:{
                ticks:{color: '#9C9A94'},
                grid: {color: '#2A2A2D'}
              },
              y:{
                ticks:{color : '#9C9A94'},
                grid: {color : '#2A2A2D'}
              }
            },
            plugins: {
              legend: {
                labels: {color : '#F1EFEA'}
              }
            }
          }
        });

        average = total / count;

        

        fetch(`${API_URL}/cost`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json'},
          credentials: 'include',
          body : JSON.stringify({ total : total })
        })
          .then(function(res){ return res.json(); })
          .then(function(data){
            if (data.error) {
              document.getElementById('costDisplay').innerHTML = 'Estimated cost: Not available';
            } else {
              document.getElementById('costDisplay').innerHTML = 'Estimated cost: $' + data.cost.toFixed(2);
            }
            cost = data.cost;
            fetch(`${API_URL}/summaries`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json'},
          credentials: 'include',
          body: JSON.stringify({ total: total, average: average, min: min, max: max, cost: data.cost})
          });
          });

        document.getElementById("savePdfButton").style.display = "block";
        document.getElementById("results").style.display = "grid";
        document.getElementById("usageChart").style.display ="block";
        document.getElementById("totalDisplay").innerHTML = "Total: " + total.toFixed(2) + " kWh";
        document.getElementById("averageDisplay").innerHTML = "Average: " + average.toFixed(2) + " kWh";
        document.getElementById("minDisplay").innerHTML = "Lowest usage: " + min.toFixed(2) + " kWh on " + minDate;
        document.getElementById("maxDisplay").innerHTML = "Highest usage: " + max.toFixed(2) + " kWh on " + maxDate;

      };

      let file = event.target.files[0];
      if (!file) {
        return;
      }
      reader.readAsText(file);

    });

  document.getElementById("savePdfButton").addEventListener("click", function(){

  const doc = new jspdf.jsPDF();

  doc.text("Total energy : " + total.toFixed(2) + " kWh", 10, 10);
  doc.text("Average usage : " + average.toFixed(2) + " kWh", 10, 20);
  doc.text("Lowest usage : " + min.toFixed(2) + " kWh on " + minDate, 10, 30);
  doc.text("Highest usage : " + max.toFixed(2) + " kWh on " + maxDate, 10, 40);

  if (cost !== undefined) {
    doc.text("Estimated cost : $" + cost.toFixed(2), 10, 50);
  } else {
    doc.text("Estimated cost : Not available", 10, 50);
  }

  doc.save("energy_stats_summary.pdf");
});

    

  </script>

</body>
</html>
