<!DOCTYPE html>
<html>
<head>
  <title>CSV Stats Reader</title>
  <link rel="stylesheet" href="style.css">
  <script src="chart.umd.min.js"></script>
  <script src="jspdf.umd.min.js"></script>
</head>
<body>

  <h1>CSV Stats Reader</h1>

  <input type="file" id="fileinput">

  <div id="results">
    <p id="totalDisplay"></p>
    <p id="averageDisplay"></p>
    <p id="minDisplay"></p>
    <p id="maxDisplay"></p>
    <p id="costDisplay"></p>
  </div>

  <canvas id="usageChart"></canvas>

  <button id="savePdfButton" style="display: none;">Save Summary as PDF</button>

  <script>

    let kwhValues = [];
    let dateLabels = [];
    let readingsBatch = [];
    let total = 0;
    let count = 0;
    let min = Infinity;
    let max = -Infinity;
    let minDate = "";
    let maxDate = "";
    let average;
    let myChart;

    document.getElementById("fileinput").addEventListener("change", function(event){

      let reader = new FileReader();

      reader.onload = function(){

        kwhValues = [];
        dateLabels = [];
        readingsBatch = [];
        let lines = reader.result.split("\n");
        let header = lines[0].split(",");
        total = 0;
        count = 0;
        min = Infinity;
        max = -Infinity;
        minDate = "";
        maxDate = "";

        if(header[0] == "date" && header[1] == "kwh"){}
        else{
          alert("ERROR file format not supported")
          return;

        }
        

        for (let i = 1; i < lines.length; i++){

          if (lines[i] === "") { continue; }

          let parts = lines[i].split(",");
          let kwh = Number(parts[1]);
          if(isNaN(kwh)){
            alert("ERROR file uploaded has unsupported data")
            break;
          }

          total += kwh;
          kwhValues.push(kwh);
          dateLabels.push(parts[0]);
          readingsBatch.push({date:parts[0], kwh:kwh});
          count++;

          if (kwh < min){
            min = kwh;
            minDate = parts[0];
          }
          if (kwh > max){
            max = kwh;
            maxDate = parts[0];
          }
        }

        fetch('http://localhost:3000/readings',{
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(readingsBatch)
          });
        
        if (myChart){
          myChart.destroy();
        }

        myChart = new Chart(document.getElementById("usageChart"), {
          type: 'line',
          data: {
            labels: dateLabels,
            datasets: [{
              label: 'kwh Usage',
              data: kwhValues,
            }]
          }, 
          options: {
            color: '#E8EDF2',
            scales : {
              x:{
                ticks:{color: '#8B98A5'},
                grid: {color: '#26323F'}
              },
              y:{
                ticks:{color : '#8B98A5'},
                grid: {color : '#26323F'}
              }
            },
            plugins: {
              legend: {
                labels: {color : '#E8EDF2'}
              }
            }
          }
        });

        average = total / count;

        

        fetch('http://localhost:3000/cost', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json'},
          body : JSON.stringify({ total : total })
        })
          .then(function(res){ return res.json(); })
          .then(function(data){
            fetch('http://localhost:3000/summaries', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json'},
          body: JSON.stringify({ total: total, average: average, min: min, max: max, cost: data.cost})
          });
            document.getElementById('costDisplay').innerHTML = 'Estimated cost: $' + data.cost;
          });

        document.getElementById("savePdfButton").style.display = "block";
        document.getElementById("results").style.display = "grid";
        document.getElementById("usageChart").style.display ="block";
        document.getElementById("totalDisplay").innerHTML = "Total: " + total;
        document.getElementById("averageDisplay").innerHTML = "Average: " + average;
        document.getElementById("minDisplay").innerHTML = " Lowest usage: " + min + " on " + minDate;
        document.getElementById("maxDisplay").innerHTML = " Highest usage: " + max + " on " + maxDate;

      };

      let file = event.target.files[0];
      reader.readAsText(file);

    });

    document.getElementById("savePdfButton").addEventListener("click", function(){

      const doc = new jspdf.jsPDF();

      doc.text("Total energy : " + total, 10, 10);
      doc.text("Average usage : " + average, 10, 20);
      doc.text("Lowest usage : " + min + " on " + minDate, 10, 30);
      doc.text("Highest usage : " + max + " on " + maxDate, 10, 40);

      doc.save("energy_stats_summary.pdf");
    });

  </script>

</body>
</html>
