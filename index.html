<!DOCTYPE html>
<html>
<head>
  <title>CSV Stats Reader</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="chart.umd.min.js"></script>
  <script src="jspdf.umd.min.js"></script>
</head>
<body>

<header class = "topBar">
<h1>CSV Stats Reader</h1>
<button id ="logoutButton">Log Out</button>
</header>
<p class="uploadHint">
Upload a CSV file with <code>date</code> and <code>kwh</code> columns. <br>
<a href="sample_usage.csv" download>Download a sample CSV</a>
</p>

  <input type="file" id="fileinput">

  <div id="results">
    <p id="totalDisplay"></p>
    <p id="averageDisplay"></p>
    <p id="minDisplay"></p>
    <p id="maxDisplay"></p>
    <p id="costDisplay"></p>
  </div>

  <canvas id="usageChart"></canvas>

  <button id="savePdfButton" style="display: none;">Save Summary as PDF</button>
  

  <script>
    const API_URL = 'http://127.0.0.1:3000';
    let currentUser = null;

    document.getElementById("logoutButton").addEventListener("click", function(){
      fetch(`${API_URL}/auth/logout`, {
        method: 'POST',
        credentials: 'include'
      }).then(function(res){
        if (res.ok){
          window.location.href = "login.html";
        } else {
          alert("LOGOUT FAILED");
        }
      });
      });

    fetch(`${API_URL}/auth/me`, {
      method: 'GET',
      credentials: 'include'
    })
    .then(function(res){ return res.json(); })
    .then(function(data){
      if (data.user === null){
        window.location.href = "login.html";
      } else {
        currentUser = data.user;
      }
    });
    



    let kwhValues = [];
    let dateLabels = [];
    let readingsBatch = [];
    let total = 0;
    let count = 0;
    let min = Infinity;
    let max = -Infinity;
    let minDate = "";
    let maxDate = "";
    let average;
    let myChart;
    let cost;
    let stdDev;
    let spikeThreshold;

    document.getElementById("fileinput").addEventListener("change", function(event){

      let reader = new FileReader();

      reader.onload = function(){

        kwhValues = [];
        dateLabels = [];
        readingsBatch = [];
        let lines = reader.result.split("\n");
        let header = lines[0].split(",").map(function(item){ return item.trim().toLowerCase(); });
        total = 0;
        count = 0;
        min = Infinity;
        max = -Infinity;
        minDate = "";
        maxDate = "";
        cost = undefined;


        /*
        AVERAGE DEBUGGING SESSION:
        console.log('Header found:', header);
        console.log('header[1] char codes:', header[1].split('').map(function(c) { return c.charCodeAt(0); }));
        console.log('header[0] check:', header[0] == "date");
        console.log('header[1] check:', header[1] == "kwh");
        console.log('Comparison result:', header[0] == "date" && header[1] == "kwh");
        console.log('header[0] length:', header[0].length, JSON.stringify(header[0]));
        console.log('header[1] length:', header[1].length, JSON.stringify(header[1])); */

        
        if(header[0] == "date" && header[1] == "kwh"){}
        else{
          alert("ERROR file format not supported")
          return;

        }
        

        for (let i = 1; i < lines.length; i++){

          if (lines[i].trim() === "") { continue; }

          let parts = lines[i].split(",").map(function(item){ return item.trim();});
          let kwh = Number(parts[1]);
          if(isNaN(kwh)){
            alert("ERROR file uploaded has unsupported data")
            return;
          }

          total += kwh;
          kwhValues.push(kwh);
          dateLabels.push(parts[0]);
          readingsBatch.push({date:parts[0], kwh:kwh});
          count++;

          if (kwh < min){
            min = kwh;
            minDate = parts[0];
          }
          if (kwh > max){
            max = kwh;
            maxDate = parts[0];
          }
        }

        fetch(`${API_URL}/readings`,{
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            credentials: 'include',
            body: JSON.stringify(readingsBatch)
          });
        
    

        average = total / count;

        let sumSquares = 0;
        for (let i  = 0; i < kwhValues.length; i++){

          let diff = kwhValues[i] - average;
          sumSquares += diff * diff;
        
        }
        stdDev = Math.sqrt(sumSquares / count);


        spikeThreshold = average + 1.5 * stdDev;

        if (myChart){
          myChart.destroy();
        }

        myChart = new Chart(document.getElementById("usageChart"), {
          type: 'line',
          data: {
            labels: dateLabels,
            datasets: [
              {
                label: 'kWh usage',
                data: kwhValues,
                borderColor: '#D9A21B',
                backgroundColor: 'rgba(217, 162, 27, 0.15)',
                // red, larger dot for spike days; normal gold dot otherwise
                pointBackgroundColor: kwhValues.map(function (v) {
                  return v > spikeThreshold ? '#E06C75' : '#D9A21B';
                }),
                pointRadius: kwhValues.map(function (v) {
                  return v > spikeThreshold ? 6 : 3;
                })
              },
              {
                label: 'Spike threshold',
                data: kwhValues.map(function () { return spikeThreshold; }),
                borderColor: '#E06C75',
                borderDash: [6, 4],
                borderWidth: 1.5,
                pointRadius: 0
              }
            ]
          }, 
          options: {
            color: '#F1EFEA',
            scales : {
              x:{
                ticks:{color: '#9C9A94'},
                grid: {color: '#2A2A2D'}
              },
              y:{
                ticks:{color : '#9C9A94'},
                grid: {color : '#2A2A2D'}
              }
            },
            plugins: {
              legend: {
                labels: {color : '#F1EFEA'}
              }
            }
          }
        });
        

        

        fetch(`${API_URL}/cost`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json'},
          credentials: 'include',
          body : JSON.stringify({ total : total })
        })
          .then(function(res){ return res.json(); })
          .then(function(data){
            if (data.error) {
              document.getElementById('costDisplay').innerHTML = 'Estimated cost: Not available';
            } else {
              document.getElementById('costDisplay').innerHTML = 'Estimated cost: $' + data.cost.toFixed(2);
            }
            cost = data.cost;
            fetch(`${API_URL}/summaries`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json'},
          credentials: 'include',
          body: JSON.stringify({ total: total, average: average, min: min, max: max, cost: data.cost})
          });
          });

        document.getElementById("savePdfButton").style.display = "block";
        document.getElementById("results").style.display = "grid";
        document.getElementById("usageChart").style.display ="block";
        document.getElementById("totalDisplay").innerHTML = "Total: " + total.toFixed(2) + " kWh";
        document.getElementById("averageDisplay").innerHTML = "Average: " + average.toFixed(2) + " kWh";
        document.getElementById("minDisplay").innerHTML = "Lowest usage: " + min.toFixed(2) + " kWh on " + minDate;
        document.getElementById("maxDisplay").innerHTML = "Highest usage: " + max.toFixed(2) + " kWh on " + maxDate;

      };

      let file = event.target.files[0];
      if (!file) {
        return;
      }
      reader.readAsText(file);

    });

    function buildReport() {
      const doc = new jspdf.jsPDF({ unit: "mm", format: 'a4' });
      const pageW = 210;
      const pageH = 297;
      const margin = 16;
      const contentW = pageW - margin * 2;

      const ink = [11, 11, 12];
      const panel = [21, 21, 23];
      const gold = [217, 162, 27];
      const text = [30, 30, 32];
      const muted = [110, 108, 104];
      const line = [226, 224, 219];
      const tint = [248, 246, 241];

      function fmt(n) {return n.toFixed(2);}

      doc.setFillColor(...ink);
      doc.rect(0,0, pageW, 34, 'F');
      doc.setFillColor(...gold);
      doc.rect(0,34, pageW, 1.2, 'F');

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(9);
      doc.setTextColor(...gold);
      doc.setCharSpace(1.2);
      doc.text('PEAK', margin, 14);
      doc.setCharSpace(0);

      doc.setFontSize(18);
      doc.setTextColor(255,255,255);
      doc.text('Energy Usage Report', margin, 25);

      const generated = new Date().toLocaleDateString('en-US', {year : 'numeric', month: 'short', day: 'numeric'});
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      doc.setTextColor(170, 168, 162);
      doc.text('Generated ' + generated, pageW - margin, 14, {align: 'right'});
      if (currentUser && currentUser.username){
        doc.text('Account: ' + currentUser.username, pageW - margin, 25, {align: 'right'});
      }

      let y  = 47;
      const firstDate = dateLabels[0];
      const lastDate = dateLabels[dateLabels.length - 1];
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(11);
      doc.setTextColor(...text);
      doc.text('Reporting period', margin, y);
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(...muted);
      doc.text(firstDate + '  to  ' + lastDate + '  |  ' + count + ' daily readings', margin + 36, y);

      y += 8;
      const tiles = [
        { label: 'TOTAL USAGE', value: fmt(total), unit: 'kWh', note: 'across ' + count + ' days' },
        { label: 'DAILY AVERAGE', value: fmt(average), unit: 'kWh', note: 'per day' },
        { label: 'PEAK DAY', value: fmt(max), unit: 'kWh', note: maxDate },
        { label: 'ESTIMATED COST', value: cost !== undefined ? '$' + fmt(cost) : 'N/A', unit: '', note: cost !== undefined ? 'at CA residential rate' : 'price unavailable' }
      ];
      const gap = 4;
      const tileW = (contentW - gap * 3) / 4;
      const tileH = 26;

      tiles.forEach(function (t, i) {
        const x = margin + i * (tileW + gap);

        doc.setFillColor(...tint);
        doc.setDrawColor(...line);
        doc.setLineWidth(0.2);
        doc.roundedRect(x, y, tileW, tileH, 2, 2, 'FD');

        doc.setFont('helvetica', 'bold');
        doc.setFontSize(7);
        doc.setTextColor(...muted);
        doc.text(t.label, x + 4, y + 7);

        doc.setFontSize(15);
        doc.setTextColor(...text);
        doc.text(t.value, x + 4, y + 16);
        if (t.unit) {
          const w = doc.getTextWidth(t.value);
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(8);
          doc.setTextColor(...muted);
          doc.text(t.unit, x + 5 + w, y + 16);
        }

        doc.setFont('helvetica', 'normal');
        doc.setFontSize(7.5);
        doc.setTextColor(...muted);
        doc.text(t.note, x + 4, y + 22);
      });

      y += tileH + 10;
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(11);
      doc.setTextColor(...text);
      doc.text('Daily usage', margin, y);
      y += 4; 

      const chartH = 70;
      doc.setFillColor(...panel);
      doc.roundedRect(margin, y, contentW, chartH, 2.5, 2.5, 'F');

      if(myChart){

        const src = myChart.canvas;
        const flat = document.createElement('canvas');
        flat.width = src.width;
        flat.height = src.height;
        const ctx = flat.getContext('2d');
        ctx.fillStyle = '#151517';
        ctx.fillRect(0,0, flat.width, flat.height );
        ctx.drawImage(src, 0, 0);
        const img = flat.toDataURL('image/jpeg', 0.95);


        const boxW = contentW - 8;
        const boxH = chartH - 8;
        const scale = Math.min(boxW / flat.width, boxH / flat.height);
        const w = flat.width * scale;
        const h = flat.height * scale;
        doc.addImage(img, 'JPEG', margin + 4 + (boxW - w) / 2, y + 4 + (boxH - h) / 2 , w, h);

      }
      y += chartH + 10;

    // Readings table

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(11);
      doc.setTextColor(...text);
      doc.text('Daily readings (highest usage first)', margin, y);
      y += 5;

      // x position of each column
      const col = { date: margin + 4, kwh: margin + 80, diff: margin + 130, flag: pageW - margin - 4 };
      const rowH = 7;

      function tableHeader() {
        doc.setFillColor(...ink);
        doc.rect(margin, y, contentW, rowH, 'F');
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(8);
        doc.setTextColor(255, 255, 255);
        doc.text('DATE', col.date, y + 4.7);
        doc.text('USAGE (kWh)', col.kwh, y + 4.7, { align: 'right' });
        doc.text('VS. AVERAGE', col.diff, y + 4.7, { align: 'right' });
        doc.text('NOTE', col.flag, y + 4.7, { align: 'right' });
        y += rowH;
      }

            // Pair each date with its kWh so they stay together when sorted
      const rows = kwhValues.map(function (v, i) {
        return { date: dateLabels[i], kwh: v };
      });

      // Highest usage first
      rows.sort(function (a, b) { return b.kwh - a.kwh; });

      tableHeader();

      for (let i = 0; i < rows.length; i++) {
        // Start a new page if this row would run into the footer
        if (y + rowH > pageH - 22) {
          doc.addPage();
          y = margin;
          tableHeader();
        }

        // Shade every other row
        if (i % 2 === 1) {
          doc.setFillColor(...tint);
          doc.rect(margin, y, contentW, rowH, 'F');
        }

        const v = rows[i].kwh;
        const diffPct = ((v - average) / average) * 100;
        const isPeak = v === max;
        const isLow = v === min;

        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        doc.setTextColor(...text);
        doc.text(rows[i].date, col.date, y + 4.8);

        doc.setFont('helvetica', isPeak ? 'bold' : 'normal');
        doc.text(fmt(v), col.kwh, y + 4.8, { align: 'right' });

        doc.setFont('helvetica', 'normal');
        if (diffPct > 0) {
          doc.setTextColor(180, 60, 50);
        } else {
          doc.setTextColor(40, 130, 90);
        }
        doc.text((diffPct > 0 ? '+' : '') + diffPct.toFixed(1) + '%', col.diff, y + 4.8, { align: 'right' });

        if (isPeak || isLow) {
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(7.5);
          doc.setTextColor(...(isPeak ? [180, 60, 50] : [40, 130, 90]));
          doc.text(isPeak ? 'PEAK' : 'LOWEST', col.flag, y + 4.8, { align: 'right' });
        }

        y += rowH;
      }

      doc.setDrawColor(...line);
      doc.line(margin, y, pageW - margin, y);

      // Footer on every page
      const pages = doc.getNumberOfPages();
      for (let p = 1; p <= pages; p++) {
        doc.setPage(p);
        doc.setDrawColor(...line);
        doc.line(margin, pageH - 14, pageW - margin, pageH - 14);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(7.5);
        doc.setTextColor(...muted);
        doc.text('Cost estimate uses the latest California residential electricity price from the U.S. Energy Information Administration.', margin, pageH - 9);
        doc.text('Page ' + p + ' of ' + pages, pageW - margin, pageH - 9, { align: 'right' });
      }


      return doc;

    }
      document.getElementById("savePdfButton").addEventListener("click", function(){
      buildReport().save("PeakEnergyReport.pdf")
      });

    

  </script>

</body>
</html>
