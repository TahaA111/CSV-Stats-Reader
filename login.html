<!DOCTYPE html>
<html>
<head>
  <title>Log In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

  <div class = "authLayout">
    <section class="brandPanel">
  <p class="brandName">Peak</p>
  <h2 class="brandPitch">Don't wonder. Just track.</h2>
  <ul class="brandPoints">
    <li>Track your kWh usage and estimated cost</li>
    <li>Save every upload privately to your account</li>
    <li>Download a PDF summary in one click</li>
  </ul>
</section>
  </div>

  <div id="loginForm">
    <h1>Welcome Back</h1>
    <p class="loginSubtitle">Log in to see your energy usage</p>
    <input type="email" id="loginEmail" placeholder="Email" required>
    <input type="password" id="loginPassword" placeholder="Password" required>
    <button id="loginButton">Log In</button>
    <p class="authSwitch">Don't have an account? <a href="signup.html">Create one</a></p>
  </div>

  <script>
    const API_URL = 'http://127.0.0.1:3000';

    document.getElementById("loginButton").addEventListener("click", function(){

      let email = document.getElementById("loginEmail").value;
      let password = document.getElementById("loginPassword").value;

      fetch(`${API_URL}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email, password })
      })
      .then(function(res){
        return res.json().then(function(data){
          if(res.ok){
            window.location.href = 'index.html';
          } else{
            alert(data.error || 'Login failed');
          }
        });
      });
        

    });

  </script>

</body>
</html>
